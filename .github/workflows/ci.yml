name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.0'
          channel: stable
          cache: true

      - name: Bağımlılıklar
        run: flutter pub get

      - name: Biçim kontrolü
        run: dart format --output=none --set-exit-if-changed lib test || echo "::warning::Biçimlendirilmemiş dosyalar var (dart format lib test)"

      - name: Statik analiz
        run: flutter analyze

      - name: Testler
        run: flutter test

      - name: Web derlemesi
        run: flutter build web --release
